<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kmusic Radio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Kmusic Radio: música en vivo 24/7, programas, ranking, videos y entretenimiento.">
<meta property="og:title" content="Kmusic Radio">
<meta property="og:description" content="Música en vivo 24/7, programas, ranking, videos y entretenimiento.">
<meta property="og:image" content="/assets/logo.png">
<meta name="theme-color" content="#07081a">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="nav-logo" href="#inicio" aria-label="Inicio"><img id="navLogo" src="/assets/logo-dark.png" alt="Kmusic Radio"></a>
    <ul class="nav-links" id="navLinks"></ul>
    <button class="live-pill" data-play type="button"><span class="dot"></span>EN VIVO</button>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Abrir menú" aria-expanded="false">☰</button>
  </div>
</header>

<main id="app"></main>

<footer id="footer"></footer>

<div class="player" role="region" aria-label="Reproductor en vivo">
  <div class="wrap">
    <div class="art" id="pArt" style="--c1:#3d5bff;--c2:#ffa914"></div>
    <div class="p-info"><b id="pTitle">En vivo</b><span id="pSub">Toca play para escuchar la señal</span></div>
    <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="vol"><span aria-hidden="true">🔊</span><label for="vol" style="position:absolute;left:-9999px">Volumen</label><input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></div>
    <button class="p-btn" data-play type="button" aria-label="Reproducir en vivo"></button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" type="button" aria-label="Cerrar video">✕</button>
  <div class="lb-inner" id="lbInner"></div>
</div>

<div class="dock" id="dock" hidden>
  <div class="dock-bar"><span class="live-pill" style="padding:6px 10px;font-size:11px"><span class="dot"></span>EN VIVO</span>
    <span class="dock-sp"></span>
    <button type="button" id="dockBig" aria-label="Ver en grande">⤢</button>
    <button type="button" id="dockClose" aria-label="Cerrar señal">✕</button></div>
  <div class="dock-inner" id="dockInner"></div>
</div>
<script src="/assets/site.js"></script>
</body>
</html>
